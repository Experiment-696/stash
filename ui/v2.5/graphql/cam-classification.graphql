query CamShowAssociationOptions {
  camModelSites {
    id
    name
    enabled
  }
  camModelProfiles {
    id
    displayName
    status
  }
}

mutation CamShowSetAssociations($input: CamShowAssociationsInput!) {
  camShowSetAssociations(input: $input) {
    id
    sites {
      id
      name
      icon
    }
    models {
      modelID
      displayName
      role
    }
  }
}

mutation CamShowSetRating($id: ID!, $rating100: Int) {
  camShowSetRating(id: $id, rating100: $rating100) {
    id
    rating100
    rating100Average
    rating100Count
  }
}
