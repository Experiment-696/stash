query SystemStatus {
  systemStatus {
    databaseSchema
    databasePath
    appSchema
    status
    configPath
    os
    workingDir
    homeDir
    ffmpegPath
    ffprobePath
  }
}

query MigrationStatus {
  migrationStatus {
    status
    currentSchema
    requiredSchema
    backupWillBeCreated
  }
}
