type APIToken {
  id: ID!
  name: String!
  createdAt: Timestamp!
  expiresAt: Timestamp!
  lastUsedAt: Timestamp
  revokedAt: Timestamp
}

input APITokenCreateInput {
  name: String!
  scopes: [String!]!
  lifetimeDays: Int
}

type APITokenCreateResult {
  token: APIToken!
  "Bearer credential in id.secret form. It is never available again."
  secret: String!
}
